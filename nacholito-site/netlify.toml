# Config voor de MARKETING Netlify-site (nacholitopreviewsite).
# Belangrijk: zet in die Netlify-UI 'Base directory' = nacholito-site,
# zodat dit bestand wordt gelezen. De portal-site (nacholito-bestellen)
# heeft Base directory leeg en gebruikt puur UI-instellingen — die ziet
# dit bestand dus niet en bouwt gewoon de Next.js app vanuit de repo-root.
[build]
  publish = "."
  command = "bash import-canva-assets.sh"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ─────────────────────────────────────────────────────────
# Bestelportaal lives on a second Netlify site that builds
# the Next.js app from the repo root. Update PORTAL_URL when
# the portal site exists (default name: nacholito-bestellen).
# ─────────────────────────────────────────────────────────
[[redirects]]
  from = "/bestellen"
  to = "https://nacholito-bestellen.netlify.app/bestellen"
  status = 302
  force = true

[[redirects]]
  from = "/bestellen/*"
  to = "https://nacholito-bestellen.netlify.app/bestellen/:splat"
  status = 302
  force = true

[[redirects]]
  # Legacy alias — earlier buttons linked here.
  from = "/producten"
  to = "https://nacholito-bestellen.netlify.app/bestellen"
  status = 302
  force = true

[[redirects]]
  from = "/pro"
  to = "/foodservice/"
  status = 301
  force = true
