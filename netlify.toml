# Netlify-config voor de Nacholito Next.js-app (landingspagina op de root).
# De officiële Next.js-runtime wordt door Netlify automatisch gedetecteerd —
# we zetten 'm hier dus NIET meer uit (geen NETLIFY_NEXT_PLUGIN_SKIP).

[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Langdurig cachen van de statische merk-assets in /public/assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Het B2B-bestelportaal draait als aparte app (het gebruikt SQLite, dat niet
# werkt op Netlify's serverless functions). /bestellen verwijst daarheen.
[[redirects]]
  from = "/bestellen"
  to = "https://bestellen.nacholito.nl/bestellen"
  status = 302
  force = true

# Oude /producten-links blijven werken.
[[redirects]]
  from = "/producten"
  to = "/bestellen"
  status = 301
  force = true
