[build]
  base    = "nacholito-site"
  publish = "."
  command = "bash import-canva-assets.sh"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  # /producten is een placeholder tot de echte checkout-URL bekend is.
  # Stuur door naar de chooser zodat bezoeker eerst zijn omgeving kiest.
  from = "/producten"
  to = "/"
  status = 302
  force = true

[[redirects]]
  # Optionele kortere alias voor de B2B-landing.
  from = "/pro"
  to = "/foodservice/"
  status = 301
  force = true
