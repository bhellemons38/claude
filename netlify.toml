[build]
  base    = "nacholito-site"
  publish = "."
  command = "echo 'Static site, no build step needed.'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/producten"
  to = "/#cta"
  status = 302
  force = true
