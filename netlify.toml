[build]
  base    = "nacholito-site"
  publish = "."
  command = "bash import-canva-assets.sh"

[build.environment]
  # De repo-root bevat een Next.js-app (het bestelportaal), maar deze
  # Netlify-site is puur statisch. Voorkom dat de Next.js-runtime aanslaat.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  # Oude /producten-links sturen door naar het bestelportaal.
  from = "/producten"
  to = "/bestellen"
  status = 301
  force = true

[[redirects]]
  # /bestellen verwijst naar het B2B-bestelportaal (aparte Next.js-app).
  from = "/bestellen"
  to = "https://bestellen.nacholito.nl/bestellen"
  status = 302
  force = true

[[redirects]]
  # Optionele kortere alias voor de B2B-landing.
  from = "/pro"
  to = "/foodservice/"
  status = 301
  force = true
